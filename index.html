<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天气查询台 · N 日多时段预报</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>⛅ 天气查询台</h1>
      <p class="subtitle">多地点 · 未来 N 天 · 时段云量预报 · 逐小时温度 / 降水 / 云层趋势图 · 通透度指数 VisScore</p>
      <p class="source">数据源：Open-Meteo（免费公开 API，天气逐小时预报 + 空气质量逐小时数据用于通透度计算）</p>
    </header>

    <!-- 地点管理 -->
    <section class="panel">
      <h2>📍 地点管理</h2>
      <div class="row">
        <div class="search-wrap">
          <input id="loc-search" type="text" placeholder="🔍 搜索地点（如：张掖、张掖丹霞景区），自动填充经纬度" autocomplete="off">
          <div id="loc-search-dropdown" class="search-dropdown hidden"></div>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <input id="loc-name" type="text" placeholder="地点名称（如：张掖丹霞）" autocomplete="off">
        <input id="loc-coord" type="text" placeholder="纬度, 经度（支持 38.91555,100.1332 或度分秒 38°54′55.98″N 100°7′59.52″E）" autocomplete="off">
        <button id="btn-add" class="btn primary">保存地点</button>
      </div>
      <div id="loc-hint" class="hint"></div>
      <div id="loc-list" class="chips"></div>
    </section>

    <!-- 查询配置 -->
    <section class="panel">
      <h2>⚙️ 查询配置</h2>
      <div class="row">
        <div class="field">
          <label for="days">未来 <b id="days-val">7</b> 天</label>
          <input type="range" id="days" min="1" max="16" value="7" step="1">
          <span class="range-labels"><em>1</em><em>16</em></span>
        </div>
        <div class="field periods" id="periods">
          <span class="field-title">时段：</span>
          <label><input type="checkbox" value="sunrise" checked> 🌅 日出</label>
          <label><input type="checkbox" value="morning" checked> ☀️ 上午</label>
          <label><input type="checkbox" value="afternoon" checked> 🌞 下午</label>
          <label><input type="checkbox" value="sunset" checked> 🌇 夕阳</label>
        </div>
        <div class="field source" id="source">
          <span class="field-title">数据源：</span>
          <label><input type="radio" name="source" value="open-meteo" checked> Open-Meteo <em>16天</em></label>
          <label><input type="radio" name="source" value="wttr"> wttr.in <em>3天</em></label>
          <label><input type="radio" name="source" value="both"> 双源对照 <em>3天内</em></label>
        </div>
        <button id="btn-query" class="btn primary big">查询天气</button>
      </div>
      <div id="config-hint" class="hint"></div>
    </section>

    <!-- 结果 -->
    <section id="results" class="results" aria-live="polite"></section>

    <!-- 行程规划器 -->
    <section class="panel" id="itinerary-panel">
      <h2>🗺️ 行程规划器</h2>
      <p class="panel-desc">可添加多段行程对比。每段行程按天安排，每天分「日出 / 上午 / 下午 / 夕阳」4 个时段，每个时段填入一个地点，即可查看该地点的出游适宜度（通透度 + 天气 + 温度）。</p>
      <div class="row">
        <div class="field">
          <label for="itin-start">起始日期</label>
          <input type="date" id="itin-start">
        </div>
        <div class="field">
          <label for="itin-days">行程 <b id="itin-days-val">3</b> 天</label>
          <input type="range" id="itin-days" min="1" max="10" value="3" step="1">
        </div>
        <button id="btn-itin-generate" class="btn">新增行程</button>
        <button id="btn-itin-query" class="btn primary big">查询行程适宜度</button>
      </div>
      <div id="itin-hint" class="hint"></div>
      <div id="itin-list" class="itin-list"></div>
    </section>
  </div>

  <template id="loc-chip-tpl">
    <label class="chip">
      <input type="checkbox" class="chip-check">
      <span class="chip-body">
        <span class="chip-name"></span>
        <span class="chip-coord"></span>
      </span>
      <span class="chip-fill" title="填入输入框">↪</span>
      <span class="chip-del" title="删除">✕</span>
    </label>
  </template>

  <script src="app.js"></script>
</body>
</html>
